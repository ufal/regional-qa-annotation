{% extends "index.html" %}

{% block content %}

<div class="container">
    <!-- show list of users -->
    <h2 class="mt-5">Users</h2>
    <ul class="list-group">
        {% for user in users %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="/admin/user/{{user.username}}">{{user.username}}</a>
            <span class="badge bg-primary rounded-pill">{{user.numvalid}} annotations</span>
        </li>
        {% endfor %}
    </ul>

</div>

{% endblock %}
