<!-- a flask template which extends the index.html template and provides an annotation interface to a logged in user-->

{% extends "index.html" %}

{% block content %}
<p>Here you can annotate the data, {{username}}</p>

<!-- the page contains an iframe on the RIGHT hand side with a page from a given URL usign style flex: 1
     on the left hand side there is a form with two fields qeustion and answer and two buttons
     one to submit the form and the other to skip the current question and move to the next one

     the default question and answer values are stored in question and answer variables
  -->
<div style="display: flex;">
  <div style="flex: 1;">
    <form action="/annotate" method="post">
      <label for="question">Question:</label><br>
      <input type="text" id="question" name="question" value="{{question}}"><br>
      <label for="answer">Answer:</label><br>
      <input type="text" id="answer" name="answer" value="{{answer}}"><br><br>
      <input type="submit" value="Submit">
      <input type="submit" value="Skip" name="skip">
    </form>
  </div>
  <div style="flex: 1;">
    <iframe src="{{url}}" width="100%" height="100%"></iframe>
  </div>
</div>

{% endblock %}
