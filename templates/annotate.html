<!-- a flask template which extends the index.html template and provides an annotation interface to a logged in user-->

{% extends "index.html" %}

{% block content %}

<script>
  $(document).ready(function(){

    $.ajax({
        type: "GET",
        url: "https://{{wiki_lang}}.wikipedia.org/w/api.php?action=parse&format=json&prop=text&page={{wiki_title}}&callback=?",
        contentType: "application/json; charset=utf-8",
        async: false,
        dataType: "json",
        success: function (data, textStatus, jqXHR) {

            var content = data.parse.text["*"];
	    // remove <style> tags from the content:
	    content = content.replace(/<style([\s\S]*?)<\/style>/g, '');
	    var title = data.parse.title;
	    $('#title').html(title);
            $('#article').html(content)

        },
        error: function (errorMessage) {
        }
    });

      $('#article').on('click', 'img', function(e){
          e.preventDefault();
          var img_url = $(this).attr('src');
          $('#imgurl').val(img_url);
      });


  });
</script>

<!-- hide infoboxes -->
<style>
  .infobox {
	display: none;
  }
  .sidebar {
      	display: none;
  }
  .metadata {
	  	display: none;
  }
  .mw-editsection {
      	display: none;
  }

  /* #form { */
  /*     position: fixed; */
  /*     left: calc(50% + (400px/2)) ; */

  /* } */
</style>



<div class="container-fluid p-0 d-flex h-100">
  <nav class="d-flex flex-column flex-shrink-0 p-3 position-sticky sticky-top h-50" style="width: 320px;">
    <form action="/annotate" method="post">
      <!--hidden fields for wiki title and language -->
      <input type="hidden" id="wiki_title" name="wiki_title" value="{{wiki_title}}">
      <input type="hidden" id="wiki_lang" name="wiki_lang" value="{{wiki_lang}}">

      <div class="form-group">
	<label for="question">Question:</label>
	<textarea class="form-control" id="question" name="question" rows="3"></textarea>
      </div>
      <div class="form-group">
	<label for="answer">Answer:</label>
	<textarea class="form-control" id="answer" name="answer" rows="3"></textarea>
      </div>
      <div class="form-group">
	<button type="submit" class="btn btn-light" name="skip">Skip</button>
	<button type="submit" class="btn btn-primary">Submit</button>
      </div>

      <div class="form-group">
	<label for="imgurl">Image URL:</label>
	<input type="text" class="form-control" id="imgurl" name="imgurl">
      </div>
    </form>
  </nav>

  <main role="main" class="flex-fill">
    <div class="pt-3 pb-2 mb-3 border-bottom">
      <h1 id="title" class="h2"></h1>
    </div>
    <div id="article"></div>
  </main>
</div>

{% endblock %}
