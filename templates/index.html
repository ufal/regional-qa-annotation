<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>{% block title %}Home{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
<!--<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body>



<div class="container">
  <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">

    <div class="col-md-3 mb-2 mb-md-0">
      <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">Regional QA</a>
    </div>

    <div class="col-md-3 text-end">

      {% if username %}
        {% if request.path != "/" %}
          <a href="/" role="button" class="btn btn-outline-primary me-2">Dashboard</a>
        {% else %}
          <a href="/annotate" role="button" class="btn btn-primary me-2">Annotation</a>
        {% endif %}

        <a href="/logout" role="button" class="btn btn-outline-primary me-2">Logout {{username}}</a>
      {% else %}
        <a href="/login" role="button" class="btn btn-primary me-2">Login</a>
      {% endif %}

    </div>
  </header>

  {% block content %}{% endblock %}

</div>
</body>
