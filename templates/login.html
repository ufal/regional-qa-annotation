<!-- this is a flask template for a simple login page -->
<!-- extends the index.html template and adds a login form -->

{% extends "index.html" %}

{% block content %}

<!-- error block for displaying errors. using bootstrap classes and it is nice -->
{% if error %}
	<div class="alert alert-danger" role="alert">
		{{ error }}
	</div>
{% endif %}

		<h2>Login</h2>
		<form method="POST">
				<input type="text" name="username" placeholder="Username" required>
				<input type="password" name="password" placeholder="Password" required>
				<input type="submit" value="Login">
		</form>
{% endblock %}
