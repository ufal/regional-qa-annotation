<!-- this is a flask template for a simple login page -->
<!-- extends the index.html template and adds a login form -->

{% extends "index.html" %}

{% block content %}

<!-- error block for displaying errors. using bootstrap classes and it is nice -->
{% if error %}
	<div class="alert alert-danger" role="alert">
		{{ error }}
	</div>
{% endif %}

<div class="d-flex justify-content-center align-items-top">
	<div class="p-5 rounded col-4" >
		<p class="lead">Welcome! Please log in to annotate.</p>
		<form method="POST">
			<div class="mb-3">
				<label for="username" class="form-label">Username</label>
				<input type="text" class="form-control" id="username" name="username" required>
			</div>
			<div class="mb-3">
				<label for="password" class="form-label">Password</label>
				<input type="password" class="form-control" id="password" name="password" required>
			</div>
			<button type="submit" class="btn btn-primary">Login</button>
		</form>
	</div>
{% endblock %}
